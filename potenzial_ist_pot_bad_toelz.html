<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Potenzialanalyse ist pot bad toelz</title>
<script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
<style>
  body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0 auto; max-width: 800px; background: #fff; color: #222; }
  .header { padding: 20px 30px 4px 30px; }
  .header h1 { font-size: 20px; margin: 0 0 2px 0; color: #1D4B8F; }
  .header p { font-size: 13px; margin: 0; color: #555; }
  #chart { width: 100%; height: 620px; }
  .footer { padding: 4px 30px 16px 30px; font-size: 11px; color: #888; }
</style>
</head>
<body>
<div class="header">
  <h1>ist pot bad toelz: Potenzialanalyse</h1>
  <p>Nutzenergie [GWh/a] – Ist-Stand, wirtschaftliches und technisches Potenzial je Energieträger</p>
</div>
<div id="chart"></div>
<div class="footer">Quelle: Kommunale Wärmeplanung ist pot bad toelz, EWO-Kompetenzzentrum Energie EKO e.V.</div>
<script>
const labels = ["Solarthermie", "Energieholz", "Oberfl. Geothermie (EWS & GWWP)", "Luft-Wasser-WP", "Umweltw\u00e4rme Kl\u00e4rwasser", "Fernw\u00e4rme", "ind. Abw\u00e4rme (Pr\u00fcfung ob EE)", "Biogas W\u00e4rme", "Gesamt (erneuerbar)"];
const ist = [2.9, 21.8, 1.0, 5.3, 0.0, 19.6, 0.0, 0.0, 50.6];
const wirt = [4.4, 19.5, 18.0, 19.5, 1.2, 0.0, 0.0, 3.2, 65.9];
const techx = [0.0, 0.0, 7.7, 73.9, 0.0, 44.4, 1.4, 0.0, 127.5];
const gesamtbedarf = 176.4;
const konservativ = 143.2;
const ambitioniert = 124.3;

const istWirt = ist.map((v, i) => v + wirt[i]);

const traceIst = { x: labels, y: ist, customdata: ist, type: 'bar', name: 'Ist 2023', width: 0.5,
  marker: { color: '#4F81BD' }, hovertemplate: '%{x}<br>Ist 2023: %{customdata:.1f} GWh/a<extra></extra>' };
const traceWirt = { x: labels, y: wirt, base: ist, customdata: wirt, type: 'bar', name: 'wirtschaftliches Potenzial', width: 0.5,
  marker: { color: '#92D050' }, hovertemplate: '%{x}<br>wirtschaftliches Potenzial: %{customdata:.1f} GWh/a<extra></extra>' };
const traceTech = { x: labels, y: techx, base: istWirt, customdata: techx, type: 'bar', name: 'technisches Potenzial', width: 0.5,
  marker: { color: '#D7E4BD' }, hovertemplate: '%{x}<br>technisches Potenzial: %{customdata:.1f} GWh/a<extra></extra>' };

const lineShapes = [
  { type: 'line', x0: -0.5, x1: labels.length - 0.5, y0: gesamtbedarf, y1: gesamtbedarf, line: { color: '#C00000', width: 2 } },
  { type: 'line', x0: -0.5, x1: labels.length - 0.5, y0: konservativ, y1: konservativ, line: { color: '#984807', width: 2, dash: 'dash' } },
  { type: 'line', x0: -0.5, x1: labels.length - 0.5, y0: ambitioniert, y1: ambitioniert, line: { color: '#F79646', width: 2, dash: 'dash' } },
];
const legendLines = [
  { x: [null], y: [null], mode: 'lines', name: 'Gesamtbedarf Nutzwärme 2023', line: { color: '#C00000', width: 2 } },
  { x: [null], y: [null], mode: 'lines', name: 'konservatives Sanierungsszenario (2045)', line: { color: '#984807', width: 2, dash: 'dash' } },
  { x: [null], y: [null], mode: 'lines', name: 'ambitioniertes Sanierungsszenario (2045)', line: { color: '#F79646', width: 2, dash: 'dash' } },
];

const layout = {
  barmode: 'overlay',
  font: { family: 'Segoe UI, Arial, sans-serif', size: 13, color: '#333' },
  margin: { t: 10, l: 60, r: 20, b: 130 },
  xaxis: { tickangle: -30, automargin: true },
  yaxis: { title: 'Nutzenergie [GWh/a]', gridcolor: '#eee', zeroline: false },
  legend: { orientation: 'h', y: 1.18, x: 0 },
  shapes: lineShapes,
  plot_bgcolor: '#fff', paper_bgcolor: '#fff'
};

Plotly.newPlot('chart', [traceIst, traceWirt, traceTech, ...legendLines], layout, {responsive: true, displayModeBar: false});
</script>
</body>
</html>
