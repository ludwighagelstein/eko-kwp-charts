function buildTraces(dd) {
  const areaTraces = dd.traces.map(t => ({
    x: dd.years, y: t.y, name: t.name, type: 'scatter', mode: 'none',
    stackgroup: 'one', fillcolor: t.color, line: { width: 0 },
    hoverinfo: 'skip' }));
  const lineTraces = [
    { x: dd.years, y: dd.total, name: 'Gesamt', type: 'scatter', mode: 'lines',
       line: { color: '#FF6602', width: 2.5 }, hoverinfo: 'skip' },
    { x: dd.years, y: dd.fossil, customdata: dd.fossil_pct, name: 'fossiler Anteil', type: 'scatter', mode: 'lines',
       line: { color: '#333333', width: 2 }, hovertemplate: 'fossil: %{customdata:.0f}%<extra></extra>' },
    { x: dd.years, y: dd.renew, customdata: dd.renew_pct, name: 'erneuerbarer Anteil', type: 'scatter', mode: 'lines',
       line: { color: '#00A24D', width: 2 }, hovertemplate: 'erneuerbar: %{customdata:.0f}%<extra></extra>' },
  ];
  return areaTraces.concat(lineTraces);
}
const layout = {
  font: { family: 'Segoe UI, Arial, sans-serif', size: 13, color: '#333' },
  margin: { t: 20, l: 60, r: 10, b: 40 },
  xaxis: { dtick: 5, gridcolor: '#eee' },
  yaxis: { title: 'GWh/a', gridcolor: '#eee', zeroline: false },
  // Legende rechts statt darunter: 14 Energietraeger ergeben unten fuenf Zeilen
  // und kosten ~110 px Hoehe, die im flachen StoryMaps-Block fehlen.
  legend: { orientation: 'v', x: 1, xanchor: 'left', y: 1, yanchor: 'top', font: { size: 11 } },
  plot_bgcolor: '#fff', paper_bgcolor: '#fff', hovermode: 'x unified'
};

const NARROW_PX = 620;

function responsive(base) {
  if (window.innerWidth >= NARROW_PX) return base;
  const l = JSON.parse(JSON.stringify(base));
  l.legend = { orientation: 'h', x: 0, xanchor: 'left', y: -0.12, yanchor: 'top',
               font: { size: 9 }, tracegroupgap: 2 };
  l.margin = { t: 8, l: 40, r: 8, b: 8 };
  if (l.yaxis) { l.yaxis.title = ''; l.yaxis.tickfont = { size: 9 }; }
  if (l.xaxis) { l.xaxis.tickfont = { size: 9 }; }
  // Annotationen sitzen breit rechts im Rand; schmal gibt es den nicht mehr,
  // also unter die Legende. Ohne das wuerden sie am Blockrand abgeschnitten.
  if (l.annotations) l.annotations.forEach(a => {
    a.font = { size: 9 };
    a.x = 0; a.xanchor = 'left'; a.y = -0.34; a.yanchor = 'top'; a.align = 'left';
  });
  return l;
}

// Beim Drehen des Geraets bzw. Groessenwechsel neu aufbauen.
function onResize(redraw) {
  let last = window.innerWidth >= NARROW_PX;
  window.addEventListener('resize', () => {
    const now = window.innerWidth >= NARROW_PX;
    if (now !== last) { last = now; redraw(); }
  });
}

let aktuellesSzenario = 'Fortschreibung';
function draw() {
  Plotly.react('chart', buildTraces(aktuellesSzenario === 'Fortschreibung' ? dataFS : dataO45),
               responsive(layout), {responsive: true, displayModeBar: false});
}
function showScenario(sz) {
  aktuellesSzenario = sz;
  document.getElementById('btn-fs').classList.toggle('active', sz === 'Fortschreibung');
  document.getElementById('btn-o45').classList.toggle('active', sz === 'O45');
  draw();
}
draw();
onResize(draw);
