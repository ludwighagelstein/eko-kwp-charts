<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<!-- Ohne diese Zeile nehmen mobile Browser 980 px Layoutbreite an und skalieren
     die fertige Seite herunter: das Desktop-Layout erscheint winzig, und weder
     die Media-Query noch responsive() greifen, weil innerWidth 980 bleibt. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sanierungsszenario Bad Tölz</title>
<script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
<style>
  html, body { height: 100%; }
  body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0 auto; max-width: 1000px;
    background: #fff; color: #222; display: flex; flex-direction: column; }
  .header { padding: 20px 30px 4px 30px; flex: none; }
  .header h1 { font-size: 20px; margin: 0 0 2px 0; color: #1D4B8F; }
  .header p { font-size: 13px; margin: 0; color: #555; }
  #chart { width: 100%; flex: 1 1 auto; min-height: 400px; }
  .footer { padding: 4px 30px 16px 30px; font-size: 11px; color: #888; flex: none; }
  .toggle { padding: 0 30px 8px 30px; flex: none; }
  .toggle button { font-family: inherit; font-size: 13px; padding: 6px 16px; margin-right: 8px;
    border: 1px solid #1D4B8F; background: #fff; color: #1D4B8F; border-radius: 4px; cursor: pointer; }
  .toggle button.active { background: #1D4B8F; color: #fff; }

  /* Schmale Ansichten (Handy): Kopf und Raender schrumpfen, damit vom knappen
     Platz mehr beim Diagramm ankommt. Die Hoehe selbst ist kein Engpass, wenn
     die Einbettung per iFrame-Code mit fester Hoehe erfolgt -- siehe
     embed_snippet(). */
  @media (max-width: 620px) {
    .header { padding: 10px 12px 2px 12px; }
    .header h1 { font-size: 15px; }
    .header p { font-size: 11px; }
    .toggle { padding: 0 12px 6px 12px; }
    .toggle button { font-size: 11px; padding: 4px 10px; margin-right: 4px; }
    .footer { padding: 2px 12px 8px 12px; font-size: 9px; }
  }
</style>
</head>
<body>
<div class="header">
  <h1>Bad Tölz: Sanierungsszenario</h1>
  <p>Nutzenergie [MWh] je Stützjahr, Szenario Fortschreibung/O45</p>
</div>
<div id="chart"></div>
<div class="footer">Quelle: Kommunale Wärmeplanung Bad Tölz, EWO-Kompetenzzentrum Energie EKO e.V.</div>
<script>
const years = [2023, 2030, 2035, 2040, 2045];
const fort = [176351.2, 165053.6, 157433.8, 150168.9, 143242.3];
const o45 = [176351.2, 158284.2, 146020.3, 134706.5, 124269.4];

const traceFort = { x: years, y: fort, type: 'bar', name: 'Sanierungsszenario Fortschreibung',
  marker: { color: '#8B0000' }, hovertemplate: '%{x}<br>Fortschreibung: %{y:.0f} MWh<extra></extra>' };
const traceO45 = { x: years, y: o45, type: 'bar', name: 'Sanierungsszenario O45',
  marker: { color: '#E57373' }, hovertemplate: '%{x}<br>O45: %{y:.0f} MWh<extra></extra>' };

const layout = {
  barmode: 'group',
  font: { family: 'Segoe UI, Arial, sans-serif', size: 13, color: '#333' },
  // Legende und Reduktionstext rechts neben die Saeulen statt darueber: der
  // Oberer Rand fuer den Reduktionstext: der sitzt ueber dem Diagramm, weil
  // unten die Legende steht. Annotationen bekommen per automargin keinen Platz
  // reserviert, anders als die Legende -- deshalb hier fest.
  margin: { t: 52, l: 70, r: 10, b: 10 },
  xaxis: { type: 'linear', tickmode: 'array', tickvals: years, ticktext: years.map(String),
            tickangle: 0, automargin: true },
  yaxis: { title: { text: 'Nutzenergie [MWh]', standoff: 20 },
            gridcolor: '#eee', zeroline: false, tickformat: ',.0f' },
  legend: { orientation: 'h', x: 0, xanchor: 'left', y: -0.16, yanchor: 'top',
             font: { size: 11 } },
  annotations: [
    { xref: 'paper', yref: 'paper', x: 1, y: 1.02, xanchor: 'right', yanchor: 'bottom', showarrow: false,
       align: 'right', font: { size: 11, color: '#333' },
       text: ["Fortschreibung 2023\u21922045: -33,109 MWh (-19 %)", "O45 2023\u21922045: -52,082 MWh (-30 %)"].join('<br>') }
  ],
  plot_bgcolor: '#fff', paper_bgcolor: '#fff'
};


const NARROW_PX = 620;

function responsive(base, legendeEintraege) {
  if (window.innerWidth >= NARROW_PX) return base;
  const l = JSON.parse(JSON.stringify(base));
  const gedrehteTicks = !!(l.xaxis && l.xaxis.tickangle);
  const traceorder = base.legend && base.legend.traceorder;
  l.legend = { orientation: 'h', x: 0, xanchor: 'left', yanchor: 'top',
               font: { size: 9 }, tracegroupgap: 2,
               // Gedrehte Achsenbeschriftungen brauchen unter dem Diagramm
               // Platz; eine Legende direkt darunter landet sonst mitten drin.
               y: gedrehteTicks ? -0.5 : -0.12 };
  // l.legend wird komplett ersetzt -- eine gesetzte Reihenfolge mitnehmen.
  if (traceorder) l.legend.traceorder = traceorder;
  // Zwei Spalten (entrywidth als Bruchteil der Legendenbreite) nur bei vielen
  // Eintraegen: einspaltig wird die Legende dann so hoch, dass Plotly sie
  // scrollbar macht und abschneidet. Bei wenigen Eintraegen waere es schaedlich,
  // weil lange Namen wie "konservatives Sanierungsszenario (2045)" nicht in eine
  // halbe Spalte passen und in die Nachbarspalte laufen.
  if (legendeEintraege > 8) {
    l.legend.entrywidthmode = 'fraction';
    l.legend.entrywidth = 0.5;
  }
  l.margin = { t: 8, l: 40, r: 8, b: 8 };
  if (l.yaxis) { l.yaxis.title = ''; l.yaxis.tickfont = { size: 9 }; }
  if (l.xaxis) { l.xaxis.tickfont = { size: 9 }; }
  // Annotationen bleiben ueber dem Diagramm, linksbuendig. Unter die Legende
  // gesetzt rutschten sie aus dem Block heraus, weil deren Hoehe hier nicht
  // bekannt ist. Der obere Rand muss dafuer per Hand aufgehen -- Annotationen
  // bekommen von automargin keinen Platz reserviert, anders als die Legende.
  if (l.annotations && l.annotations.length) {
    l.annotations.forEach(a => {
      a.font = { size: 8 };
      a.x = 0; a.xanchor = 'left'; a.y = 1.02; a.yanchor = 'bottom'; a.align = 'left';
    });
    l.margin.t = 42;
  }
  return l;
}

// Beim Drehen des Geraets bzw. Groessenwechsel neu aufbauen.
function onResize(redraw) {
  let last = window.innerWidth >= NARROW_PX;
  window.addEventListener('resize', () => {
    const now = window.innerWidth >= NARROW_PX;
    if (now !== last) { last = now; redraw(); }
  });
}

function draw() {
  const traces = [traceFort, traceO45];
  Plotly.react('chart', traces, responsive(layout, traces.length),
               {responsive: true, displayModeBar: false});
}
draw();
onResize(draw);
</script>
</body>
</html>
