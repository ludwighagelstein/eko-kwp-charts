<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Sanierungsszenario Bad Tölz</title>
<script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
<style>
  html, body { height: 100%; }
  body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0 auto; max-width: 800px;
    background: #fff; color: #222; display: flex; flex-direction: column; }
  .header { padding: 20px 30px 4px 30px; flex: none; }
  .header h1 { font-size: 20px; margin: 0 0 2px 0; color: #1D4B8F; }
  .header p { font-size: 13px; margin: 0; color: #555; }
  #chart { width: 100%; flex: 1 1 auto; min-height: 525px; }
  .footer { padding: 4px 30px 16px 30px; font-size: 11px; color: #888; flex: none; }
  .toggle { padding: 0 30px 8px 30px; flex: none; }
  .toggle button { font-family: inherit; font-size: 13px; padding: 6px 16px; margin-right: 8px;
    border: 1px solid #1D4B8F; background: #fff; color: #1D4B8F; border-radius: 4px; cursor: pointer; }
  .toggle button.active { background: #1D4B8F; color: #fff; }
</style>
</head>
<body>
<div class="header">
  <h1>Bad Tölz: Sanierungsszenario</h1>
  <p>Nutzenergie [MWh] je Stützjahr, Szenario Fortschreibung/O45</p>
</div>
<div id="chart"></div>
<div class="footer">Quelle: Kommunale Wärmeplanung Bad Tölz, EWO-Kompetenzzentrum Energie EKO e.V.</div>
<script>
const years = [2023, 2030, 2035, 2040, 2045];
const fort = [176351.2, 165053.6, 157433.8, 150168.9, 143242.3];
const o45 = [176351.2, 158284.2, 146020.3, 134706.5, 124269.4];

const traceFort = { x: years, y: fort, type: 'bar', name: 'Sanierungsszenario Fortschreibung',
  marker: { color: '#8B0000' }, hovertemplate: '%{x}<br>Fortschreibung: %{y:.0f} MWh<extra></extra>' };
const traceO45 = { x: years, y: o45, type: 'bar', name: 'Sanierungsszenario O45',
  marker: { color: '#E57373' }, hovertemplate: '%{x}<br>O45: %{y:.0f} MWh<extra></extra>' };

const layout = {
  barmode: 'group',
  font: { family: 'Segoe UI, Arial, sans-serif', size: 13, color: '#333' },
  margin: { t: 140, l: 70, r: 20, b: 60 },
  xaxis: { type: 'linear', tickmode: 'array', tickvals: years, ticktext: years.map(String),
            tickangle: -30, automargin: true },
  yaxis: { title: 'Nutzenergie [MWh]', gridcolor: '#eee', zeroline: false, tickformat: ',.0f' },
  legend: { orientation: 'h', y: 1.04, x: 0 },
  annotations: [
    { xref: 'paper', yref: 'paper', x: 1, y: 1.16, xanchor: 'right', yanchor: 'bottom', showarrow: false,
       align: 'right', font: { size: 12, color: '#333' },
       text: ["Fortschreibung 2023\u21922045: -33,109 MWh (-19 %)", "O45 2023\u21922045: -52,082 MWh (-30 %)"].join('<br>') }
  ],
  plot_bgcolor: '#fff', paper_bgcolor: '#fff'
};

Plotly.newPlot('chart', [traceFort, traceO45], layout, {responsive: true, displayModeBar: false});
</script>
<script>
(function () {
  if (window.parent === window) return;
  function report() {
    window.parent.postMessage(
      { sentinel: 'amp', type: 'embed-size', height: Math.ceil(document.documentElement.scrollHeight) },
      '*');
  }
  window.addEventListener('load', report);
  window.addEventListener('resize', report);
  report();
})();
</script>
</body>
</html>
