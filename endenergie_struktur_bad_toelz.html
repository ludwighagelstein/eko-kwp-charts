<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<!-- Ohne diese Zeile nehmen mobile Browser 980 px Layoutbreite an und skalieren
     die fertige Seite herunter: das Desktop-Layout erscheint winzig, und weder
     die Media-Query noch responsive() greifen, weil innerWidth 980 bleibt. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
<style>
  html, body { height: 100%; }
  body { font-family: 'Avenir Next', 'Open Sans', 'Segoe UI', Arial, sans-serif; margin: 0 auto; max-width: 1000px;
    background: #fff; color: #222; display: flex; flex-direction: column; }
  .header { padding: 20px 30px 4px 30px; flex: none; }
  .header h1 { font-size: 20px; margin: 0 0 2px 0; color: #1D4B8F; }
  .header p { font-size: 13px; margin: 0; color: #555; }
  #chart { width: 100%; flex: 1 1 auto; min-height: 200px; }
  .footer { padding: 4px 30px 16px 30px; font-size: 11px; color: #888; flex: none; }
  .toggle { padding: 0 30px 8px 30px; flex: none; }
  .toggle button { font-family: inherit; font-size: 13px; padding: 6px 16px; margin-right: 8px;
    border: 1px solid #1D4B8F; background: #fff; color: #1D4B8F; border-radius: 4px; cursor: pointer; }
  .toggle button.active { background: #1D4B8F; color: #fff; }

  /* Schmale Ansichten (Handy): Kopf und Raender schrumpfen, damit vom knappen
     Platz mehr beim Diagramm ankommt. Die Hoehe selbst ist kein Engpass, wenn
     die Einbettung per iFrame-Code mit fester Hoehe erfolgt -- siehe
     embed_snippet(). */
  @media (max-width: 620px) {
    .header { padding: 10px 12px 2px 12px; }
    .header h1 { font-size: 15px; }
    .header p { font-size: 11px; }
    .toggle { padding: 0 12px 6px 12px; }
    .toggle button { font-size: 11px; padding: 4px 10px; margin-right: 4px; }
    .footer { padding: 2px 12px 4px 12px; font-size: 9px; }
  }
</style>
<style>
  /* Drei Panels teilen sich die Resthoehe gleichmaessig. */
  #charts { flex: 1 1 auto; display: flex; flex-direction: column;
             min-height: 600px; }
  .teil { flex: 1 1 0; min-height: 200px; }
</style>
</head>
<body>
<div class="header">
  <h1>Bad Tölz: Endenergieverbrauch 2023</h1>
  <p>Aufteilung nach Energieträger, Sektor und Gebäudetyp</p>
</div>
<div id="charts">
  <div class="teil" id="teil0"></div>
  <div class="teil" id="teil1"></div>
  <div class="teil" id="teil2"></div>
</div>
<div class="footer">Quelle: Kommunale Wärmeplanung Bad Tölz, EWO-Kompetenzzentrum Energie EKO e.V.</div>
<script>
const gruppen = [{"achse": "Energietr\u00e4ger", "eintraege": [{"label": "Energieholz", "wert": 16.58, "farbe": "#6FAC46"}, {"label": "Solarthermie", "wert": 2.91, "farbe": "#FFCF00"}, {"label": "Fernw\u00e4rme EE", "wert": 12.78, "farbe": "#F39C12"}, {"label": "Fernw\u00e4rme fossil", "wert": 6.81, "farbe": "#BB5C07"}, {"label": "Luft-Wasser-WP", "wert": 1.76, "farbe": "#326F90"}, {"label": "Oberfl. GT", "wert": 0.26, "farbe": "#83ACFC"}, {"label": "Heizstrom", "wert": 0.22, "farbe": "#1225A0"}, {"label": "BHKW-W\u00e4rme", "wert": 5.12, "farbe": "#B22222"}, {"label": "Fl\u00fcssiggas", "wert": 1.47, "farbe": "#887894"}, {"label": "Erdgas", "wert": 108.24, "farbe": "#999999"}, {"label": "Kohle", "wert": 0.62, "farbe": "#7C350B"}, {"label": "Heiz\u00f6l", "wert": 48.88, "farbe": "#4A4A4A"}]}, {"achse": "Sektor", "eintraege": [{"label": "Kommunal", "wert": 2.12, "farbe": "#00A24D"}, {"label": "GHD", "wert": 87.33, "farbe": "#F39C12"}, {"label": "private Haushalte", "wert": 116.22, "farbe": "#326F90"}]}, {"achse": "Geb\u00e4udetyp", "eintraege": [{"label": "Nichtwohngeb\u00e4ude", "wert": 89.46, "farbe": "#1D4B8F"}, {"label": "Wohnen MFH", "wert": 63.34, "farbe": "#6FAC46"}, {"label": "Wohnen EFH/DHH/RH", "wert": 52.86, "farbe": "#E8C547"}]}];
const OBERGRENZE = 220;

function layoutFuer(gruppe) {
  return {
    barmode: 'stack',
    font: { family: "'Avenir Next', 'Open Sans', 'Segoe UI', Arial, sans-serif", size: 13, color: '#333' },
    margin: { t: 8, l: 110, r: 20, b: 44 },
    // Feste, gemeinsame Achse: sonst skaliert jeder Balken eigenstaendig und
    // die drei Balken waeren trotz gleicher Summe unterschiedlich lang.
    xaxis: { range: [0, OBERGRENZE], dtick: 20, gridcolor: '#eee', automargin: true,
              title: { text: "<b>Endenergieverbrauch 2023 [ GWh / a ]</b>", standoff: 12, font: { size: 13 } },
              ticks: 'outside', ticklen: 6, tickcolor: 'rgba(0,0,0,0)',
              showline: true, linecolor: '#595959', linewidth: 1, zeroline: false },
    yaxis: { showgrid: false, ticks: 'outside', ticklen: 8, tickcolor: 'rgba(0,0,0,0)',
              showline: true, linecolor: '#595959', linewidth: 1,
              tickmode: 'array', tickvals: [gruppe.achse],
              ticktext: ['<b>' + gruppe.achse + '</b>'] },
    legend: { orientation: 'h', x: 0, xanchor: 'left', y: 1.02, yanchor: 'bottom',
               font: { size: 12 }, traceorder: 'normal' },
    separators: ',.', plot_bgcolor: '#fff', paper_bgcolor: '#fff'
  };
}

async function draw() {
  const schmal = window.innerWidth < 620;
  await Promise.all(gruppen.map((g, i) => {
    const balken = g.eintraege.map(e => ({
      x: [e.wert], y: [g.achse], type: 'bar', orientation: 'h', name: e.label,
      marker: { color: e.farbe }, width: 0.5, showlegend: false,
      hovertemplate: e.label + ': %{x:.1f} GWh/a<extra></extra>'
    }));
    // Runde Legendensymbole: fuer Balken zeichnet Plotly ein Rechteck und kennt
    // keine Option fuer die Form. Deshalb je Reihe eine leere Punkt-Spur, die
    // ausschliesslich den Legendeneintrag liefert. Der Klick darauf wird in
    // legendeVerdrahten() auf die zugehoerige Balken-Spur uebertragen.
    const legendenPunkte = g.eintraege.map(e => ({
      x: [null], y: [null], type: 'scatter', mode: 'markers', name: e.label,
      marker: { symbol: 'circle', size: schmal ? 8 : 11, color: e.farbe },
      hoverinfo: 'skip', showlegend: true
    }));
    const traces = balken.concat(legendenPunkte);
    const l = layoutFuer(g);
    if (schmal) {
      // Schmal ist links kein Platz fuer die Kategorienamen; die stehen dann
      // als Titel ueber dem Panel.
      l.margin = { t: 8, l: 34, r: 8, b: 40 };
      l.yaxis.showticklabels = false;
      l.legend.font = { size: 9 };
      if (g.eintraege.length > 8) {
        l.legend.entrywidthmode = 'fraction';
        l.legend.entrywidth = 0.5;
      }
      l.xaxis.title.font = { size: 10 };
      l.annotations = [{ xref: 'paper', yref: 'paper', x: 0, y: 1.02, xanchor: 'left',
                          yanchor: 'bottom', showarrow: false, text: '<b>' + g.achse + '</b>',
                          font: { size: 10, color: '#1D4B8F' } }];
      l.legend.y = 1.16;
    }
    return Plotly.react('teil' + i, traces, l, {responsive: true, displayModeBar: false})
      .then(() => legendeVerdrahten(document.getElementById('teil' + i), g));
  }));
  await zeichenflaechenAusgleichen();
}

// Der Legendenklick trifft die Punkt-Spur; ohne diese Verdrahtung bliebe der
// zugehoerige Balken stehen. Nur einmal je Panel anhaengen, sonst wuerde der
// Handler bei jedem Neuzeichnen doppelt reagieren.
//
// Statt die Balken-Spur auf visible:false zu setzen, laeuft ihr Wert weich auf
// Null: 'visible' ist in Plotly nicht animierbar und wuerde springen, der
// Balkenwert dagegen schon. Die uebrigen Segmente schieben sich dadurch
// fliessend nach. Das Ausgrauen des Legendeneintrags macht Plotly selbst an der
// Punkt-Spur, deshalb wird das Standardverhalten nicht unterdrueckt.
function legendeVerdrahten(gd, gruppe) {
  if (gd._legendeVerdrahtet) return;
  gd._legendeVerdrahtet = true;
  const anzahl = gruppe.eintraege.length;
  gd.on('plotly_legendclick', ev => {
    const balken = ev.curveNumber - anzahl;
    if (balken < 0 || balken >= anzahl) return;
    const ausgeblendet = gd._ausgeblendet || (gd._ausgeblendet = {});
    const jetztAus = !ausgeblendet[balken];
    ausgeblendet[balken] = jetztAus;
    const voll = gruppe.eintraege[balken].wert;
    weichSetzen(gd, balken, jetztAus ? 0 : voll);
  });
}

// Plotly kann Balken nicht animieren: 'Plotly.animate' bleibt wirkungslos, und
// 'Plotly.react' mit layout.transition aendert zwar die Daten, zeichnet aber
// nicht neu (Darstellung bliebe veraltet stehen). Deshalb selbst schrittweise
// per restyle interpolieren - das zeichnet zuverlaessig.
const ANIM_DAUER = 450;
function weichSetzen(gd, spur, ziel) {
  const laufend = gd._anim || (gd._anim = {});
  laufend[spur] = (laufend[spur] || 0) + 1;
  const marke = laufend[spur];
  const von = Number(gd.data[spur].x[0]) || 0;
  const start = performance.now();
  // Bewusst setTimeout statt requestAnimationFrame: rAF steht in verborgenen
  // Tabs und iframes still, die Animation waere dort nie fertig und die
  // Darstellung bliebe auf halbem Weg stehen. Der Fortschritt kommt aus der
  // Uhrzeit, die Dauer stimmt also auch bei gebremsten Timern.
  function schritt() {
    if (laufend[spur] !== marke) return;   // neuerer Klick hat uebernommen
    const t = Math.min(1, (performance.now() - start) / ANIM_DAUER);
    const e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    Plotly.restyle(gd, { x: [[von + (ziel - von) * e]] }, [spur]);
    if (t < 1) setTimeout(schritt, 16);
  }
  schritt();
}

// Die Legende der Energietraeger braucht mehr Zeilen als die der anderen
// Panels; Plotly vergroessert dafuer den oberen Rand und verkleinert die
// Zeichenflaeche. Folge: kuerzere y-Achse und duennerer Balken in diesem Panel.
// Deshalb nach dem Rendern alle Zeichenflaechen auf die kleinste angleichen -
// damit stimmen Achsenlaenge und Balkendicke ueberall ueberein, ohne an der
// Balkenbreite zu drehen.
async function zeichenflaechenAusgleichen() {
  const divs = [0, 1, 2].map(i => document.getElementById('teil' + i));
  // Mehrere Durchlaeufe: automargin holt sich einen Teil des zusaetzlichen
  // Randes wieder zurueck, ein einzelner Schritt trifft die Zielhoehe nicht.
  for (let durchlauf = 0; durchlauf < 6; durchlauf++) {
    const laengen = divs.map(d => d._fullLayout && d._fullLayout.yaxis
                                  ? d._fullLayout.yaxis._length : null);
    if (laengen.some(l => !l)) return;
    const ziel = Math.min(...laengen);
    if (Math.max(...laengen) - ziel <= 1) return;
    await Promise.all(divs.map((d, i) => {
      const zusatz = laengen[i] - ziel;
      return zusatz > 0.5
        ? Plotly.relayout(d, { 'margin.t': d._fullLayout.margin.t + zusatz })
        : Promise.resolve();
    }));
  }
}

draw();
let warSchmal = window.innerWidth < 620;
window.addEventListener('resize', () => {
  const jetzt = window.innerWidth < 620;
  if (jetzt !== warSchmal) { warSchmal = jetzt; draw(); }
});
</script>
</body>
</html>
