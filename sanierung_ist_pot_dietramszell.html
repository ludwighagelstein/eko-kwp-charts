<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Sanierungsszenario Ist Pot Dietramszell</title>
<script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
<style>
  body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0 auto; max-width: 800px; background: #fff; color: #222; }
  .header { padding: 20px 30px 4px 30px; }
  .header h1 { font-size: 20px; margin: 0 0 2px 0; color: #1D4B8F; }
  .header p { font-size: 13px; margin: 0; color: #555; }
  #chart { width: 100%; height: 560px; }
  .footer { padding: 4px 30px 16px 30px; font-size: 11px; color: #888; }
</style>
</head>
<body>
<div class="header">
  <h1>Ist Pot Dietramszell: Sanierungsszenario</h1>
  <p>Nutzenergie [MWh] je Stützjahr, Szenario Fortschreibung/O45</p>
</div>
<div id="chart"></div>
<div class="footer">Quelle: Kommunale Wärmeplanung Ist Pot Dietramszell, EWO-Kompetenzzentrum Energie EKO e.V.</div>
<script>
const years = [2024, 2030, 2035, 2040, 2045];
const fort = [59858.3, 54829.5, 50970.4, 47384.9, 44053.6];
const o45 = [59858.3, 54466.3, 50246.2, 46353.1, 42761.6];

const traceFort = { x: years, y: fort, type: 'bar', name: 'Sanierungsszenario Fortschreibung',
  marker: { color: '#8B0000' }, hovertemplate: '%{x}<br>Fortschreibung: %{y:.0f} MWh<extra></extra>' };
const traceO45 = { x: years, y: o45, type: 'bar', name: 'Sanierungsszenario O45',
  marker: { color: '#E57373' }, hovertemplate: '%{x}<br>O45: %{y:.0f} MWh<extra></extra>' };

const layout = {
  barmode: 'group',
  font: { family: 'Segoe UI, Arial, sans-serif', size: 13, color: '#333' },
  margin: { t: 140, l: 70, r: 20, b: 60 },
  xaxis: { type: 'linear', tickmode: 'array', tickvals: years, ticktext: years.map(String),
            tickangle: -30, automargin: true },
  yaxis: { title: 'Nutzenergie [MWh]', gridcolor: '#eee', zeroline: false, tickformat: ',.0f' },
  legend: { orientation: 'h', y: 1.04, x: 0 },
  annotations: [
    { xref: 'paper', yref: 'paper', x: 1, y: 1.16, xanchor: 'right', yanchor: 'bottom', showarrow: false,
       align: 'right', font: { size: 12, color: '#333' },
       text: ["Fortschreibung 2024\u21922045: -15,805 MWh (-26 %)", "O45 2024\u21922045: -17,097 MWh (-29 %)"].join('<br>') }
  ],
  plot_bgcolor: '#fff', paper_bgcolor: '#fff'
};

Plotly.newPlot('chart', [traceFort, traceO45], layout, {responsive: true, displayModeBar: false});
</script>
</body>
</html>
