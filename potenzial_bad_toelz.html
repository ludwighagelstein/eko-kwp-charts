<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Potenzialanalyse Bad Tölz</title>
<script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
<style>
  html, body { height: 100%; }
  body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0 auto; max-width: 1000px;
    background: #fff; color: #222; display: flex; flex-direction: column; }
  .header { padding: 20px 30px 4px 30px; flex: none; }
  .header h1 { font-size: 20px; margin: 0 0 2px 0; color: #1D4B8F; }
  .header p { font-size: 13px; margin: 0; color: #555; }
  #chart { width: 100%; flex: 1 1 auto; min-height: 300px; }
  .footer { padding: 4px 30px 16px 30px; font-size: 11px; color: #888; flex: none; }
  .toggle { padding: 0 30px 8px 30px; flex: none; }
  .toggle button { font-family: inherit; font-size: 13px; padding: 6px 16px; margin-right: 8px;
    border: 1px solid #1D4B8F; background: #fff; color: #1D4B8F; border-radius: 4px; cursor: pointer; }
  .toggle button.active { background: #1D4B8F; color: #fff; }

  /* Schmale Bloecke (StoryMaps auf dem Handy): dort ist der Block nur rund
     330 px breit und entsprechend flach. Kopf und Raender schrumpfen, damit
     vom knappen Platz moeglichst viel beim Diagramm ankommt. */
  @media (max-width: 620px) {
    .header { padding: 10px 12px 2px 12px; }
    .header h1 { font-size: 15px; }
    .header p { font-size: 11px; }
    .toggle { padding: 0 12px 6px 12px; }
    .toggle button { font-size: 11px; padding: 4px 10px; margin-right: 4px; }
    .footer { padding: 2px 12px 8px 12px; font-size: 9px; }
    #chart { min-height: 200px; }
  }
</style>
</head>
<body>
<div class="header">
  <h1>Bad Tölz: Potenzialanalyse</h1>
  <p>Nutzenergie [GWh/a] – Ist-Stand, wirtschaftliches und technisches Potenzial je Energieträger</p>
</div>
<div id="chart"></div>
<div class="footer">Quelle: Kommunale Wärmeplanung Bad Tölz, EWO-Kompetenzzentrum Energie EKO e.V.</div>
<script>
const labels = ["Solarthermie", "Energieholz", "Oberfl. Geothermie (EWS & GWWP)", "Luft-Wasser-WP", "Umweltw\u00e4rme Kl\u00e4rwasser", "Fernw\u00e4rme", "ind. Abw\u00e4rme (Pr\u00fcfung ob EE)", "Biogas W\u00e4rme", "Gesamt (erneuerbar)"];
const ist = [2.9, 12.4, 1.0, 5.3, 0.0, 9.4, 0.0, 0.0, 31.0];
const wirt = [4.4, 19.5, 18.0, 19.5, 1.2, 41.6, 0.0, 3.2, 88.0];
const techx = [0.0, 0.0, 7.7, 73.9, 0.0, 7.0, 1.4, 0.0, 90.1];
const gesamtbedarf = 176.4;
const konservativ = 143.2;
const ambitioniert = 124.3;

const istWirt = ist.map((v, i) => v + wirt[i]);

const traceIst = { x: labels, y: ist, customdata: ist, type: 'bar', name: 'Ist 2023', width: 0.5,
  marker: { color: '#4F81BD' }, hovertemplate: '%{x}<br>Ist 2023: %{customdata:.1f} GWh/a<extra></extra>' };
const traceWirt = { x: labels, y: wirt, base: ist, customdata: wirt, type: 'bar', name: 'wirtschaftliches Potenzial', width: 0.5,
  marker: { color: '#92D050' }, hovertemplate: '%{x}<br>wirtschaftliches Potenzial: %{customdata:.1f} GWh/a<extra></extra>' };
const traceTech = { x: labels, y: techx, base: istWirt, customdata: techx, type: 'bar', name: 'technisches Potenzial', width: 0.5,
  marker: { color: '#D7E4BD' }, hovertemplate: '%{x}<br>technisches Potenzial: %{customdata:.1f} GWh/a<extra></extra>' };

const lineShapes = [
  { type: 'line', x0: -0.5, x1: labels.length - 0.5, y0: gesamtbedarf, y1: gesamtbedarf, line: { color: '#C00000', width: 2 } },
  { type: 'line', x0: -0.5, x1: labels.length - 0.5, y0: konservativ, y1: konservativ, line: { color: '#984807', width: 2, dash: 'dash' } },
  { type: 'line', x0: -0.5, x1: labels.length - 0.5, y0: ambitioniert, y1: ambitioniert, line: { color: '#F79646', width: 2, dash: 'dash' } },
];
const legendLines = [
  { x: [null], y: [null], mode: 'lines', name: 'Gesamtbedarf Nutzwärme 2023', line: { color: '#C00000', width: 2 } },
  { x: [null], y: [null], mode: 'lines', name: 'konservatives Sanierungsszenario (2045)', line: { color: '#984807', width: 2, dash: 'dash' } },
  { x: [null], y: [null], mode: 'lines', name: 'ambitioniertes Sanierungsszenario (2045)', line: { color: '#F79646', width: 2, dash: 'dash' } },
];

// Plotly bricht Achsenbeschriftungen nicht selbst um.
function wrapLabel(s, max) {
  const lines = [];
  let cur = '';
  for (const w of s.split(' ')) {
    if (cur && (cur + ' ' + w).length > max) { lines.push(cur); cur = w; }
    else { cur = cur ? cur + ' ' + w : w; }
  }
  if (cur) lines.push(cur);
  return lines.join('<br>');
}
const tickText = labels.map(l => wrapLabel(l, 16));

const layout = {
  barmode: 'overlay',
  font: { family: 'Segoe UI, Arial, sans-serif', size: 13, color: '#333' },
  margin: { t: 10, l: 60, r: 10, b: 10 },
  // Beschriftungen waagrecht und umgebrochen: -30 Grad gedreht kosten die langen
  // Energietraeger-Namen ueber automargin ~150 px Hoehe, die im flachen
  // StoryMaps-Block fehlen. Legende rechts statt darueber, aus demselben Grund.
  xaxis: { tickangle: 0, automargin: true, showline: true, linecolor: '#595959', linewidth: 1,
            tickfont: { size: 10 }, tickmode: 'array', tickvals: labels, ticktext: tickText },
  yaxis: { title: 'Nutzenergie [GWh/a]', gridcolor: '#eee', zeroline: false,
            rangemode: 'nonnegative', showline: true, linecolor: '#595959', linewidth: 1 },
  legend: { orientation: 'v', x: 1, xanchor: 'left', y: 1, yanchor: 'top', font: { size: 11 } },
  shapes: lineShapes,
  plot_bgcolor: '#fff', paper_bgcolor: '#fff'
};


const NARROW_PX = 620;

function responsive(base) {
  if (window.innerWidth >= NARROW_PX) return base;
  const l = JSON.parse(JSON.stringify(base));
  l.legend = { orientation: 'h', x: 0, xanchor: 'left', y: -0.12, yanchor: 'top',
               font: { size: 9 }, tracegroupgap: 2 };
  l.margin = { t: 8, l: 40, r: 8, b: 8 };
  if (l.yaxis) { l.yaxis.title = ''; l.yaxis.tickfont = { size: 9 }; }
  if (l.xaxis) { l.xaxis.tickfont = { size: 9 }; }
  // Annotationen sitzen breit rechts im Rand; schmal gibt es den nicht mehr,
  // also unter die Legende. Ohne das wuerden sie am Blockrand abgeschnitten.
  if (l.annotations) l.annotations.forEach(a => {
    a.font = { size: 9 };
    a.x = 0; a.xanchor = 'left'; a.y = -0.34; a.yanchor = 'top'; a.align = 'left';
  });
  return l;
}

// Beim Drehen des Geraets bzw. Groessenwechsel neu aufbauen.
function onResize(redraw) {
  let last = window.innerWidth >= NARROW_PX;
  window.addEventListener('resize', () => {
    const now = window.innerWidth >= NARROW_PX;
    if (now !== last) { last = now; redraw(); }
  });
}

function draw() {
  Plotly.react('chart', [traceIst, traceWirt, traceTech, ...legendLines], responsive(layout),
               {responsive: true, displayModeBar: false});
}
draw();
onResize(draw);
</script>
</body>
</html>
